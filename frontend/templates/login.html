<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Project & Tasks Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="split-container">
    <!-- Left side -->
    <div class="split-left">
        <h1>Welcome to Projects & Tasks Manager</h1>
        <p>Manage projects, assign tasks, and track progress with ease.</p>
    </div>

    <!-- Right side -->
    <div class="split-right">
        <!-- ✅ Corrected action -->
        <form method="POST" action="{{ url_for('login') }}" class="form-card">
            <h2>Sign In</h2>
            <input type="email" name="email" placeholder="Enter Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <a href="#">Forgot Password?</a>
            <button type="submit" class="btn">Login</button>
            <!-- ✅ Corrected link -->
            <p>Don’t have an account? <a href="{{ url_for('signup') }}">Register</a></p>
        </form>
    </div>
</div>
</body>
</html>
