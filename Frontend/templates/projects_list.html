<!DOCTYPE html>
<html>
<head>
    <title>Projects List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Projects Created by You</h2>

    {% for project in projects %}
        <div class="card">
            <h3>{{ project.name }}</h3>
            <p>{{ project.description }}</p>
            <a href="{{ url_for('create_task', project_id=project.id) }}">Assign Task</a>
        </div>
    {% else %}
        <p>No projects created yet.</p>
    {% endfor %}
</body>
</html>
